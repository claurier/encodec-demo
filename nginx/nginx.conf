# ── Routing rules ──────────────────────────────────────────────────────────────
# Each app gets its own location block (path-based routing).
# To add a new app:
#   1. Add a new location block below pointing to the app's service name and port
#   2. Add the service to docker-compose.yml
# ───────────────────────────────────────────────────────────────────────────────

server {
    listen 80;

    client_max_body_size 15M;

    # EnCodec demo — served at /
    location / {
        proxy_pass         http://encodec:7860;
        proxy_http_version 1.1;
        # Required for Gradio's websocket connection
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 300s;
    }

    # Future app example — uncomment and adapt:
    # location /other-app/ {
    #     proxy_pass         http://other-app:PORT/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade    $http_upgrade;
    #     proxy_set_header   Connection "upgrade";
    #     proxy_set_header   Host       $host;
    # }
}
